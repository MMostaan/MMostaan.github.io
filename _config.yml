# Mohammad Mostaan — Academic Pages configuration
# Designed for the Academic Pages Jekyll template, not for the old Minima site.
locale                   : "en-US"
site_theme               : "default"
title                    : "Mohammad Mostaan"
title_separator          : "|"
name                     : &name "Mohammad Mostaan"
description              : &description "AI / Machine Learning Engineer | RAG, LLM Systems & AI Agents"
url                      : "https://mmostaan.ir"
baseurl                  : ""
repository               : "MMostaan/MMostaan.github.io"

author:
  avatar                 : "profile.jpg"  # This file goes into /images/profile.jpg
  name                   : "Mohammad Mostaan"
  pronouns               :
  bio                    : "AI / Machine Learning Engineer · RAG, LLM systems, AI agents & applied research"
  location               : "Tehran, Iran"
  employer               : "Tarbiat Modares AI & Digital Technology Research Center"
  uri                    : "https://mmostaan.ir"
  email                  : "Mostaan.mohammad@gmail.com"
  academia               :
  arxiv                  :
  googlescholar          :
  inspire-hep            :
  impactstory            :
  orcid                  :
  semantic               :
  ssrn                   :
  pubmed                 :
  researchgate           :
  scopus                 :
  zotero                 :
  bitbucket              :
  codepen                :
  dribbble               :
  github                 : "MMostaan"
  kaggle                 :
  stackoverflow          :
  artstation             :
  bluesky                :
  facebook               :
  flickr                 :
  foursquare             :
  goodreads              :
  google_plus            :
  keybase                :
  instagram              :
  lastfm                 :
  linkedin               : "mostaan"
  mastodon               :
  medium                 :
  pinterest              :
  soundcloud             :
  steam                  :
  telegram               :
  tumblr                 :
  twitter                :
  vine                   :
  weibo                  :
  wikipedia              :
  xing                   :
  youtube                :
  zhihu                  :

publication_category:
  books:
    title: "Books"
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"

teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               : false
atom_feed:
  hide                   : true
  path                   :
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :
twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : "profile.jpg"
og_description           : "Mohammad Mostaan — AI / ML Engineer"
social:
  type                   : Person
  name                   : "Mohammad Mostaan"
  links:
    - "https://github.com/MMostaan"
    - "https://www.linkedin.com/in/mostaan/"
analytics:
  provider               : "false"

include:
  - .htaccess
  - _pages
  - files
exclude:
  - ".asset-cache"
  - ".bundle"
  - ".github"
  - ".jekyll-assets-cache"
  - ".sass-cache"
  - "assets/js/_main.js"
  - "assets/js/plugins"
  - "assets/js/vendor"
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - Dockerfile
  - node_modules
  - vendor
  - package.json
  - package-lock.json
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  header_links: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: false
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: false

sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Asia/Tehran
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  ignore:
    envs: development
